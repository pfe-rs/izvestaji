<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Liberation Sans, DejaVu Sans, sans-serif">
  <!-- Poredjenje metoda - Wong 2011 palette for consistency -->
  <rect width="900" height="440" fill="#FFFFFF"/>

  <!-- legend -->
  <rect x="270" y="74" width="16" height="16" fill="#009E73"/>
  <text x="292" y="87" font-size="13" fill="#222222">Matematička metoda</text>
  <rect x="490" y="74" width="16" height="16" fill="#8B5CF6"/>
  <text x="512" y="87" font-size="13" fill="#222222">CNN embedding</text>

  <!-- gridlines -->
  <g stroke="#DDDDDD" stroke-width="1">
    <line x1="180" y1="110" x2="820" y2="110"/>
    <line x1="180" y1="175" x2="820" y2="175"/>
    <line x1="180" y1="240" x2="820" y2="240"/>
    <line x1="180" y1="305" x2="820" y2="305"/>
    <line x1="180" y1="370" x2="820" y2="370"/>
  </g>

  <!-- x-axis labels -->
  <g text-anchor="middle" font-size="11" fill="#444444">
    <text x="180" y="390">0</text>
    <text x="340" y="390">25</text>
    <text x="500" y="390">50</text>
    <text x="660" y="390">75</text>
    <text x="820" y="390">100</text>
  </g>


  <!-- Top-1 -->
  <text x="60" y="125" font-size="14" font-weight="bold" fill="#222222">Top-1</text>
  <rect x="180" y="108" width="600" height="20" fill="#009E73"/>
  <text x="786" y="123" font-size="12" font-weight="bold" fill="#009E73">97,56%</text>
  <rect x="180" y="132" width="494" height="20" fill="#8B5CF6"/>
  <text x="680" y="147" font-size="12" font-weight="bold" fill="#8B5CF6">81,21%</text>

  <!-- Top-5 -->
  <text x="60" y="190" font-size="14" font-weight="bold" fill="#222222">Top-5</text>
  <rect x="180" y="173" width="616" height="20" fill="#009E73"/>
  <text x="799" y="188" font-size="12" font-weight="bold" fill="#009E73">99,2%</text>
  <rect x="180" y="197" width="550" height="20" fill="#8B5CF6"/>
  <text x="736" y="212" font-size="12" font-weight="bold" fill="#8B5CF6">90,11%</text>

  <!-- MRR -->
  <text x="60" y="255" font-size="14" font-weight="bold" fill="#222222">MRR</text>
  <rect x="180" y="238" width="588" height="20" fill="#009E73"/>
  <text x="774" y="253" font-size="12" font-weight="bold" fill="#009E73">0,976</text>
  <rect x="180" y="262" width="510" height="20" fill="#8B5CF6"/>
  <text x="696" y="277" font-size="12" font-weight="bold" fill="#8B5CF6">0,850</text>

  <!-- ms/chunk -->
  <text x="60" y="320" font-size="14" font-weight="bold" fill="#222222">ms/chunk</text>
  <rect x="180" y="303" width="150" height="20" fill="#009E73"/>
  <text x="336" y="318" font-size="12" font-weight="bold" fill="#009E73">~25</text>
  <rect x="180" y="327" width="72" height="20" fill="#8B5CF6"/>
  <text x="258" y="342" font-size="12" font-weight="bold" fill="#8B5CF6">~12</text>

</svg>
