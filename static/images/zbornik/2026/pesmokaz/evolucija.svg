<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="Liberation Sans, DejaVu Sans, sans-serif">
  <!-- Evolucija matematicke metode - Wong 2011 palette for consistency -->
  <rect width="800" height="420" fill="#FFFFFF"/>

  <!-- gridlines -->
  <g stroke="#DDDDDD" stroke-width="1">
    <line x1="80" y1="100" x2="720" y2="100"/>
    <line x1="80" y1="160" x2="720" y2="160"/>
    <line x1="80" y1="220" x2="720" y2="220"/>
    <line x1="80" y1="280" x2="720" y2="280"/>
    <line x1="80" y1="340" x2="720" y2="340"/>
  </g>

  <!-- y-axis labels -->
  <g text-anchor="end" font-size="12" fill="#444444">
    <text x="70" y="104">100</text>
    <text x="70" y="164">75</text>
    <text x="70" y="224">50</text>
    <text x="70" y="284">25</text>
    <text x="70" y="344">0</text>
  </g>
  <text x="40" y="220" text-anchor="middle" font-size="12" fill="#444444" transform="rotate(-90 40 220)">Top-1 tačnost (%)</text>

  <!-- axes -->
  <line x1="80" y1="90" x2="80" y2="340" stroke="#444444" stroke-width="1.5"/>
  <line x1="80" y1="340" x2="720" y2="340" stroke="#444444" stroke-width="1.5"/>

  <!-- bar 1: 25% grey -->
  <rect x="150" y="275" width="130" height="65" fill="#888888"/>
  <text x="215" y="265" text-anchor="middle" font-size="16" font-weight="bold" fill="#222222">25%</text>
  <text x="215" y="365" text-anchor="middle" font-size="12" fill="#222222">Originalni</text>
  <text x="215" y="380" text-anchor="middle" font-size="12" fill="#222222">parametri</text>

  <!-- bar 2: ~70% blue -->
  <rect x="335" y="158" width="130" height="182" fill="#0072B2"/>
  <text x="400" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#0072B2">~70%</text>
  <text x="400" y="365" text-anchor="middle" font-size="12" fill="#222222">Tuning broja heševa,</text>
  <text x="400" y="380" text-anchor="middle" font-size="12" fill="#222222">praga i DT</text>

  <!-- bar 3: 97.56% green -->
  <rect x="520" y="87" width="130" height="253" fill="#009E73"/>
  <text x="585" y="77" text-anchor="middle" font-size="16" font-weight="bold" fill="#009E73">97,56%</text>
  <text x="585" y="365" text-anchor="middle" font-size="12" fill="#222222">Vremensko</text>
  <text x="585" y="380" text-anchor="middle" font-size="12" fill="#222222">poravnanje</text>

</svg>
path: paper/evolucija.svg